[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "cntlib"
version = "0.1.0"
description = "CNT segmentation, morphology analysis, and evaluation workflows"
readme = "ReadMe.md"
license = { text = "Proprietary" }
authors = [ { name = "Abdelmalek Acherchari", email = "abdelmalek.cherchari@enas.fraunhofer.de" }, { name = "Bossard, Ludovic Hector", email = "ludovic.bossard@enas.fraunhofer.de" }, ]
requires-python = ">=3.12,<3.13"


dependencies = [ 
    "numpy>=1.26,<2.0", 
    "pandas>=2.2,<3.0", 
    "scipy>=1.12,<2.0", 
    "scikit-image>=0.22,<1.0", 
    "scikit-learn>=1.6,<2.0", 
    "pycocotools>=2.0.8,<3.0", 
    "matplotlib>=3.8,<4.0", 
    "seaborn>=0.13,<1.0", 
    "opencv-python-headless>=4.9,<5.0", 
    "Pillow>=10,<13", 
    "tifffile>=2025.3",
    "torch==2.6.0", 
    "imagecodecs==2025.8.2",
    "shapely>=2.0,<3.0", 
    "tqdm>=4.67,<5.0", 
    "PyWavelets>=1.8,<2.0",
    "PyYAML>=6.0,<7.0",
    "scienceplots>=2.1,<3.0",
    "edt>=3.0,<4.0",

    "stardist==0.9.1",
    "csbdeep>=0.8,<1.0",
    "tensorflow>=2.18,<2.19",

    # StarDist 0.9.1 imports pkg_resources at runtime.
    "setuptools<81",
    ]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "build>=1.2,<2",
]

notebooks = [
    "ipykernel>=6,<7",
    "ipython>=9,<10",
    "plotly>=5,<7",
    "networkx>=3,<4",
    "imageio>=2,<3",
]

experiments = [
    "astropy>=7,<8",
    "tabulate>=0.9,<1",
    "statsmodels>=0.14,<1",
    "fil-finder",
]

deep-learning-experiments = [
    "torch>=2,<3",
    "torchvision>=0.20,<1",
]


wandb = [
    "wandb>=0.19,<1.0",
]

registry = [
    "mlflow>=2,<4",
]

gpu = [
    "gputools",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cnt_project"]

[tool.hatch.build.targets.sdist]
include = [
	"src/cnt_project",
	"tests",
	"ReadMe.md",
	"pyproject.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
